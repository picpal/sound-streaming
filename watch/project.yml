name: YoutumuWatch

options:
  bundleIdPrefix: com.picpal

packages:
  YoutumuKit:
    path: ../YoutumuKit

targets:
  YoutumuWatch Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: "YoutumuWatch Watch App"
        excludes:
          - "Info.plist"
      - path: ../scripts/ca/out/ca.crt
        buildPhase: resources
    dependencies:
      - package: YoutumuKit
        product: YoutumuKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picpal.YoutumuWatch
        DEVELOPMENT_TEAM: 6626BYCJG4
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: "YoutumuWatch Watch App/Info.plist"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "6.0"
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
